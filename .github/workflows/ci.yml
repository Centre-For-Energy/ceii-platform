name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (tests + migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ceii
          POSTGRES_PASSWORD: ceii
          POSTGRES_DB: ceii
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ceii -d ceii"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ceii:ceii@localhost:5432/ceii
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt
        working-directory: backend

      - name: Run tests (incl. /ready against PostgreSQL)
        run: pytest
        working-directory: backend

      - name: Apply migrations against PostgreSQL
        run: alembic -c alembic.ini upgrade head
        working-directory: database

  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Test
        run: npm test
        working-directory: frontend

      - name: Typecheck + build
        run: npm run build
        working-directory: frontend